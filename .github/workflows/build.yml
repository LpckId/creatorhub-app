name: Build Android APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Find Project and Build APK
      run: |
        # Cari folder yang berisi build.gradle atau build.gradle.kts
        TARGET_FILE=$(find . -name "build.gradle*" -not -path "*/app/*" | head -n 1)
        if [ -z "$TARGET_FILE" ]; then
          TARGET_FILE=$(find . -name "build.gradle*" | head -n 1)
        fi
        
        PROJECT_DIR=$(dirname "$TARGET_FILE")
        echo "Found project directory: $PROJECT_DIR"
        
        cd "$PROJECT_DIR"
        gradle wrapper
        ./gradlew assembleDebug --stacktrace

    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: app-debug
        path: "**/build/outputs/apk/debug/*.apk"
